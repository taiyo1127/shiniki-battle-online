<!doctype html><html lang="ja"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神域バトル III</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1118;color:#f4f6fb;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-size:21px}.badge{padding:7px 10px;border-radius:999px;background:#262d3c;font-size:12px}.panel{background:#171d28;border:1px solid #30394b;border-radius:16px;padding:12px;margin:8px 0}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{background:#121722;border-radius:13px;padding:10px;border:1px solid #2f3747}.player.active{border-color:#8e78ff;box-shadow:0 0 0 1px #8e78ff inset}.name{display:flex;justify-content:space-between;align-items:center;font-weight:700}.hpnum{font-size:18px}.bar{height:11px;background:#2b3342;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;transition:.25s}.hp{background:#ef5350}.mp{background:#5c8cff}.equipGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.equip{background:#222a39;border-radius:11px;padding:9px;min-height:65px}.equip b{display:block}.weapon{border-left:4px solid #e5a13b}.armor{border-left:4px solid #61a6d8}.none{opacity:.55}.statuses{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.status{display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:10px;font-size:12px;background:#2a3140;border:1px solid #4a5365}.status.bad{border-color:#d05b5b;background:#352329}.status.good{border-color:#58b87b;background:#20362b}.status small{opacity:.85}.statusInfo{font-size:11px;color:#c6cbd5;margin-top:4px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button,button,input{font:inherit;border-radius:11px;border:1px solid #465168;padding:10px;background:#202735;color:#fff}button{cursor:pointer}.primary{background:#7258ef!important;border:0!important}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{min-height:128px;text-align:left;padding:9px;background:#202736}.card b{display:block;font-size:14px}.card .cost{color:#9bb5ff;font-weight:700}.card .power{font-size:18px;margin:5px 0}.card small{color:#c2c8d4}.card.weapon{border-color:#c58c38}.card.armor{border-color:#5594c1}.card.spell{border-color:#876ee0}.card.heal{border-color:#55a96e}.card.special{border-color:#c45ca5}.log{font-size:13px;line-height:1.6;max-height:180px;overflow:auto}.hint{font-size:12px;color:#aab3c4}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hidden{display:none!important}@media(max-width:520px){.cards{grid-template-columns:repeat(2,1fr)}.players{grid-template-columns:1fr 1fr}.equipGrid{grid-template-columns:1fr}.title{font-size:18px}}
</style><main><div class="top"><div class="title">⚔️ 神域バトル III</div><div id="turn" class="badge">未接続</div></div>
<div id="join" class="panel"><b>2人オンラインカードバトル</b><p class="hint">ルームコードを友達と共有して対戦</p><input id="room" maxlength="6" placeholder="例：ABC123"><button class="primary" onclick="join()">入室する</button></div>
<div id="game" class="hidden">
<div class="players"><div id="meBox" class="player"><div class="name"><span>🧙 あなた</span><span id="myHp" class="hpnum"></span></div><div class="bar"><div id="mh" class="fill hp"></div></div><div class="bar"><div id="mm" class="fill mp"></div></div><div class="hint" id="myMp"></div><div id="myStatus" class="statuses"></div></div>
<div id="opBox" class="player"><div class="name"><span>👤 相手</span><span id="opHp" class="hpnum"></span></div><div class="bar"><div id="oh" class="fill hp"></div></div><div class="bar"><div id="om" class="fill mp"></div></div><div class="hint" id="opMp"></div><div id="opStatus" class="statuses"></div></div></div>
<div class="panel"><div class="sectionTitle"><b>⚔️ お互いの装備</b><span class="hint">攻撃 / 防御</span></div><div class="equipGrid"><div id="myEquip"></div><div id="opEquip"></div></div></div>
<div class="actions"><button onclick="attack()">⚔️ 通常攻撃</button><button onclick="guard()">🛡️ 防御</button><button onclick="draw()">🎴 2枚引く</button></div>
<div class="panel"><div class="sectionTitle"><b>🎴 あなたの手札</b><span class="hint">カードをタップ</span></div><div id="cards" class="cards"></div></div>
<div class="panel"><div class="sectionTitle"><b>📜 戦闘ログ</b><span id="msg" class="hint"></span></div><div class="log" id="log"></div></div>
</div></main><script>
let ws,me=-1,st=[],turn=-1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function join(){const r=$('room').value.trim().toUpperCase();if(!r)return;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>ws.send(JSON.stringify({action:'join',room:r}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){me=m.index;$('join').classList.add('hidden');$('game').classList.remove('hidden')}if(m.type==='waiting')$('msg').textContent=m.msg;if(m.type==='error')alert(m.msg);if(m.type==='state'){st=m.state;turn=m.turn;render(m)}}}
function statusHTML(arr){if(!arr?.length)return '<span class="hint">状態異常なし</span>';return arr.map(s=>`<div class="status ${s.info.cls}" title="${esc(s.info.desc)}"><span>${s.info.icon}</span><b>${esc(s.info.name)}</b><span>${s.turns}T</span></div>`).join('')}
function equipHTML(p){const w=p.weapon?`<div class="equip weapon"><b>⚔️ ${esc(p.weapon.name)}</b><div>攻撃力 <strong>${p.weapon.power}</strong></div><div class="statusInfo">${esc(p.weapon.desc||'')}</div></div>`:`<div class="equip none">⚔️ 武器なし</div>`;const a=p.armor?`<div class="equip armor"><b>🛡️ ${esc(p.armor.name)}</b><div>防御 ${p.armor.power}%</div><div class="statusInfo">${esc(p.armor.desc||'')}</div></div>`:`<div class="equip none">🛡️ 防具なし</div>`;return w+a+(p.guard?'<div class="status good">🛡️ 防御態勢</div>':'')+(p.counter?'<div class="status good">⚡ カウンター準備</div>':'')}
function render(m){const a=st[me],b=st[1-me];$('turn').textContent=turn<0?'対戦終了':turn===me?'🔥 あなたのターン':'⏳ 相手のターン';$('meBox').classList.toggle('active',turn===me);$('opBox').classList.toggle('active',turn===1-me);$('myHp').textContent=`${a.hp}/${a.maxHp}`;$('opHp').textContent=`${b.hp}/${b.maxHp}`;$('myMp').textContent=`MP ${a.mp}/${a.maxMp}`;$('opMp').textContent=`MP ${b.mp}/${b.maxMp}`;$('mh').style.width=Math.max(0,a.hp/a.maxHp*100)+'%';$('mm').style.width=a.mp/a.maxMp*100+'%';$('oh').style.width=Math.max(0,b.hp/b.maxHp*100)+'%';$('om').style.width=b.mp/b.maxMp*100+'%';$('myStatus').innerHTML=statusHTML(a.statuses);$('opStatus').innerHTML=statusHTML(b.statuses);$('myEquip').innerHTML=equipHTML(a);$('opEquip').innerHTML=equipHTML(b);$('cards').innerHTML=a.hand.map((c,i)=>`<button class="card ${esc(c.type)}" onclick="play(${i})"><b>${esc(c.name)}</b><span class="cost">MP ${c.cost}</span><div class="power">${c.power?c.power:'✨'}</div><small>${esc(c.desc||'')}</small></button>`).join('');$('log').innerHTML=(m.log||[]).map(x=>`・${esc(x)}`).join('<br>');$('msg').textContent=m.msg||''}
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}function play(i){if(turn===me)send({action:'play',type:'card',card:i})}function attack(){if(turn===me)send({action:'attack'})}function guard(){if(turn===me)send({action:'guard'})}function draw(){if(turn===me)send({action:'draw'})}
</script></html>
