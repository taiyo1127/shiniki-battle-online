<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神域バトル Online</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#fff;text-align:center}
main{max-width:560px;margin:auto;padding:20px}
.card{background:#222;border-radius:16px;padding:16px;margin:12px 0}
input,button{font-size:18px;padding:12px;border-radius:10px;border:0;margin:5px}
button{background:#444;color:#fff;min-width:110px}
button:disabled{opacity:.4}
.hp{font-size:28px;font-weight:bold}
.log{text-align:left;background:#151515;border-radius:10px;padding:10px;min-height:100px}
.small{color:#aaa}
</style>
</head>
<body>
<main>
<h1>⚔️ 神域バトル Online</h1>
<div class="card" id="lobby">
<p>友達と同じルームコードを入力</p>
<input id="room" placeholder="例: ABC123" maxlength="12">
<button id="join">参加</button>
<p id="status" class="small">未接続</p>
</div>

<div id="game" style="display:none">
<div class="card">
<p>あなた：<span id="you"></span></p>
<p>あなたのHP</p><div class="hp" id="myhp">100</div>
<p>相手のHP</p><div class="hp" id="enemyhp">100</div>
<p>MP：<span id="mymp">5</span></p>
</div>
<div class="card">
<button data-action="attack">⚔️ 攻撃</button>
<button data-action="magic">✨ 魔法</button>
<button data-action="heal">💚 回復</button>
<p id="turn">相手を待っています…</p>
</div>
<div class="card log" id="log"></div>
</div>
</main>
<script>
let ws=null, me=-1, state=null;
const $=id=>document.getElementById(id);
function addLog(t){ $("log").innerHTML=t.slice(-8).map(x=>"<div>"+x+"</div>").join(""); }
$("join").onclick=()=>{
  const room=$("room").value.trim().toUpperCase();
  if(!room)return;
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(proto+"://"+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({type:"join",room}));
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==="joined"){me=m.playerIndex;$("status").textContent="ルーム参加中。相手を待っています…";}
    if(m.type==="players")$("status").textContent=`参加者 ${m.count}/2`;
    if(m.type==="state"){state=m.state;$("lobby").style.display="none";$("game").style.display="block";render();}
    if(m.type==="error")alert(m.message);
  };
  ws.onclose=()=>$("status").textContent="接続が切れました";
};
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"action",action:b.dataset.action}));
});
function render(){
  const e=1-me;
  $("you").textContent=`プレイヤー${me+1}`;
  $("myhp").textContent=state.hp[me];
  $("enemyhp").textContent=state.hp[e];
  $("mymp").textContent=state.mp[me];
  $("turn").textContent=state.winner!==null
    ? (state.winner===me?"🎉 あなたの勝ち！":"😢 あなたの負け…")
    : (state.turn===me?"あなたのターン！":"相手のターン…");
  document.querySelectorAll("[data-action]").forEach(b=>b.disabled=state.winner!==null||state.turn!==me);
  addLog(state.log);
}
</script>
</body>
</html>
