<!doctype html><html lang="ja"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神域バトル II</title><style>*{box-sizing:border-box}body{margin:0;background:#10131b;color:#eee;font-family:system-ui,sans-serif}main{max-width:700px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.panel{background:#191e2a;border:1px solid #343b4e;border-radius:14px;padding:12px;margin:8px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:10px;background:#303747;border-radius:9px;overflow:hidden}.hp{background:#e44;height:100%}.mp{background:#5a8cff;height:100%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{min-height:110px;background:#242b3a;border:1px solid #56617a;border-radius:12px;padding:8px;color:#fff;text-align:left}.card:active{transform:scale(.97)}.card b{display:block}.weapon{border-color:#d9943a}.spell{border-color:#8d73df}.armor{border-color:#61a6d8}.heal{border-color:#64bd76}.special{border-color:#d76bb4}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}button,input{font:inherit;border-radius:10px;border:1px solid #4a5368;padding:10px;background:#202635;color:#fff}button{cursor:pointer}.primary{background:#6b4fe3;border:0}.log{font-size:13px;line-height:1.55;max-height:150px;overflow:auto}.muted{color:#aab2c2}@media(max-width:430px){.cards{grid-template-columns:repeat(2,1fr)}} </style><main><div class="top"><h2>⚔️ 神域バトル II</h2><span id="turn"></span></div><div id="join" class="panel"><p>2人用オンラインカードバトル</p><input id="room" maxlength="6" placeholder="ルームコード"><button class="primary" onclick="join()">入室する</button><p class="muted">友達と同じルームコードを入力</p></div><div id="game" hidden><div class="stats panel"><div>あなた<br><b id="my"></b><div class="bar"><div id="mh" class="hp"></div></div><div class="bar"><div id="mm" class="mp"></div></div></div><div>相手<br><b id="op"></b><div class="bar"><div id="oh" class="hp"></div></div></div></div><div class="panel"><b>装備</b><div id="equip"></div></div><div class="actions"><button onclick="attack()">⚔️ 通常攻撃</button><button onclick="guard()">🛡️ 防御</button><button onclick="draw()">🎴 2枚引く</button></div><h3>手札</h3><div id="cards" class="cards"></div><div class="panel log" id="log"></div></div></main><script>let ws,me=-1,st,turn=-1;const $=id=>document.getElementById(id);function join(){let r=$('room').value.trim().toUpperCase();if(!r)return;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>ws.send(JSON.stringify({action:'join',room:r}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){me=m.index;$('join').hidden=true;$('game').hidden=false}if(m.type==='waiting')alert(m.msg);if(m.type==='error')alert(m.msg);if(m.type==='state'){st=m.state;turn=m.turn;render(m)}}}function render(m){let a=st[me],b=st[1-me];$('turn').textContent=turn<0?'終了':turn===me?'あなたのターン':'相手のターン';$('my').textContent=`HP ${a.hp}/${a.maxHp}　MP ${a.mp}/${a.maxMp}`;$('op').textContent=`HP ${b.hp}/${b.maxHp}`;$('mh').style.width=a.hp/a.maxHp*100+'%';$('mm').style.width=a.mp/a.maxMp*100+'%';$('oh').style.width=b.hp/b.maxHp*100+'%';$('equip').textContent=`武器: ${a.weapon?.name||'なし'}　防具: ${a.armor?.name||'なし'}　${a.guard?'🛡️防御中':''} ${a.counter?'⚡反撃中':''}`;$('cards').innerHTML=a.hand.map((c,i)=>`<button class="card ${c.type}" onclick="play(${i})"><b>${c.name}</b><small>${c.type} / MP ${c.cost}</small><br>${c.power?c.power+' 効果':''}<br><small>${c.attr||''}</small></button>`).join('');$('log').innerHTML=(m.log||[]).map(x=>`・${x}`).join('<br>')}function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}function play(i){if(turn!==me)return;send({action:'play',type:'card',card:i})}function attack(){if(turn===me)send({action:'attack'})}function guard(){if(turn===me)send({action:'guard'})}function draw(){if(turn===me)send({action:'draw'})}</script></html>
