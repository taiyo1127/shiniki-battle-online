<!doctype html><html lang="ja"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神域バトル IV</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0f16;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-size:22px;font-weight:800}.badge{padding:7px 10px;border-radius:999px;background:#262e3d;font-size:12px}.panel,.player{background:#171d28;border:1px solid #30394b;border-radius:16px;padding:12px;margin:8px 0}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{margin:0;background:#121722}.player.active{border-color:#9a84ff;box-shadow:0 0 0 1px #9a84ff inset}.name{display:flex;justify-content:space-between;align-items:center;font-weight:800}.hpnum{font-size:18px}.bar{height:10px;background:#2b3342;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;transition:.25s}.hp{background:#ef5350}.mp{background:#5c8cff}.mini{font-size:11px;color:#aeb8c8;margin-top:3px}.equipGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.equip{background:#222a39;border-radius:11px;padding:9px;margin-top:7px}.weapon{border-left:4px solid #e5a13b}.armor{border-left:4px solid #61a6d8}.trapbox{border-left:4px solid #b77cf5}.none{opacity:.55}.effect{font-size:11px;color:#cbd2de;margin-top:4px;line-height:1.45}.statuses{display:grid;grid-template-columns:1fr;gap:5px;margin-top:8px}.status{padding:7px 9px;border-radius:10px;background:#2a3140;border:1px solid #4a5365}.status.bad{border-color:#d05b5b;background:#352329}.status.good{border-color:#58b87b;background:#20362b}.statusHead{display:flex;align-items:center;gap:6px;font-size:12px}.statusDesc{font-size:11px;color:#d3d8e1;margin-top:3px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button,button,input{font:inherit;border-radius:11px;border:1px solid #465168;padding:10px;background:#202735;color:#fff}button{cursor:pointer}.primary{background:#7258ef!important;border:0!important}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card{min-height:145px;text-align:left;padding:9px;background:#202736}.card b{display:block;font-size:14px}.card .cost{color:#9bb5ff;font-weight:700}.card .power{font-size:18px;margin:5px 0}.card small{color:#c8cfdb;line-height:1.4}.card.weapon{border-color:#c58c38}.card.armor{border-color:#5594c1}.card.spell{border-color:#876ee0}.card.heal{border-color:#55a96e}.card.special{border-color:#c45ca5}.card.maxhp{border-color:#f0b84b}.card.trap{border-color:#b77cf5}.trapList{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.trapChip{padding:6px 8px;border-radius:10px;background:#252030;border:1px solid #9b68d4;font-size:12px}.log{font-size:13px;line-height:1.6;max-height:210px;overflow:auto}.hint{font-size:12px;color:#aab3c4}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hidden{display:none!important}.rule{font-size:11px;color:#aeb7c7;line-height:1.5;margin-top:8px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.players{grid-template-columns:1fr 1fr}.equipGrid{grid-template-columns:1fr}.title{font-size:18px}}
</style><main><div class="top"><div class="title">⚔️ 神域バトル IV</div><div id="turn" class="badge">未接続</div></div>
<div id="join" class="panel"><b>2人オンラインカードバトル</b><p class="hint">ルームコードを友達と共有して対戦</p><input id="room" maxlength="6" placeholder="例：ABC123"><button class="primary" onclick="join()">入室する</button></div>
<div id="game" class="hidden"><div class="players"><div id="meBox" class="player"><div class="name"><span>🧙 あなた</span><span id="myHp" class="hpnum"></span></div><div class="bar"><div id="mh" class="fill hp"></div></div><div class="bar"><div id="mm" class="fill mp"></div></div><div class="mini" id="myMp"></div><div id="myStatus" class="statuses"></div><div id="myTraps" class="trapList"></div></div><div id="opBox" class="player"><div class="name"><span>👤 相手</span><span id="opHp" class="hpnum"></span></div><div class="bar"><div id="oh" class="fill hp"></div></div><div class="bar"><div id="om" class="fill mp"></div></div><div class="mini" id="opMp"></div><div id="opStatus" class="statuses"></div><div id="opTraps" class="trapList"></div></div></div>
<div class="panel"><div class="sectionTitle"><b>⚔️ お互いの装備</b><span class="hint">武器・防具・特殊状態</span></div><div class="equipGrid"><div id="myEquip"></div><div id="opEquip"></div></div><div class="rule">相手の伏せ罠は内容が見えません。自分の罠だけ内容を確認できます。</div></div>
<div class="actions"><button onclick="attack()">⚔️ 通常攻撃</button><button onclick="guard()">🛡️ 防御</button><button onclick="draw()">🎴 2枚引く</button></div>
<div class="panel"><div class="sectionTitle"><b>🎴 あなたの手札</b><span class="hint">カードをタップして使用</span></div><div id="cards" class="cards"></div></div>
<div class="panel"><div class="sectionTitle"><b>📜 戦闘ログ</b><span id="msg" class="hint"></span></div><div class="log" id="log"></div></div></div></main><script>
let ws,me=-1,st=[],turn=-1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function join(){const r=$('room').value.trim().toUpperCase();if(!r)return;ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>ws.send(JSON.stringify({action:'join',room:r}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){me=m.index;$('join').classList.add('hidden');$('game').classList.remove('hidden')}if(m.type==='waiting')$('msg').textContent=m.msg;if(m.type==='error')alert(m.msg);if(m.type==='state'){st=m.state;turn=m.turn;render(m)}}}
function statusHTML(arr){if(!arr?.length)return '<span class="hint">状態異常・強化なし</span>';return arr.map(s=>`<div class="status ${s.info.cls}"><div class="statusHead"><span>${s.info.icon}</span><b>${esc(s.info.name)}</b><span>${s.turns}ターン</span></div><div class="statusDesc">効果：${esc(s.info.desc)}</div></div>`).join('')}
function trapHTML(p,isMe){if(!p.trapCount)return '';if(isMe&&p.traps?.length)return p.traps.map(t=>`<div class="trapChip">${t.info.icon} ${esc(t.info.name)}：${esc(t.info.desc)}</div>`).join('');return `<div class="trapChip">🃏 伏せ罠 × ${p.trapCount}</div>`}
function equipHTML(p){const w=p.weapon?`<div class="equip weapon"><b>⚔️ ${esc(p.weapon.name)}</b><div>攻撃力 <strong>${p.weapon.power}</strong></div><div class="effect">効果：${esc(p.weapon.desc||'')}</div></div>`:`<div class="equip none">⚔️ 武器なし</div>`;const a=p.armor?`<div class="equip armor"><b>🛡️ ${esc(p.armor.name)}</b><div>軽減率 <strong>${p.armor.power}%</strong></div><div class="effect">効果：${esc(p.armor.desc||'')}</div></div>`:`<div class="equip none">🛡️ 防具なし</div>`;return w+a+(p.guard?'<div class="status good"><div class="statusHead">🛡️ <b>防御態勢</b></div><div class="statusDesc">効果：次に受けるダメージを50%軽減</div></div>':'')+(p.counter?'<div class="status good"><div class="statusHead">⚡ <b>カウンター準備</b></div><div class="statusDesc">効果：次に受けた攻撃の40%を反射</div></div>':'')}
function render(m){const a=st[me],b=st[1-me];$('turn').textContent=turn<0?'対戦終了':turn===me?'🔥 あなたのターン':'⏳ 相手のターン';$('meBox').classList.toggle('active',turn===me);$('opBox').classList.toggle('active',turn===1-me);$('myHp').textContent=`${a.hp}/${a.maxHp}`;$('opHp').textContent=`${b.hp}/${b.maxHp}`;$('myMp').textContent=`MP ${a.mp}/${a.maxMp}`;$('opMp').textContent=`MP ${b.mp}/${b.maxMp}`;$('mh').style.width=Math.max(0,a.hp/a.maxHp*100)+'%';$('mm').style.width=a.mp/a.maxMp*100+'%';$('oh').style.width=Math.max(0,b.hp/b.maxHp*100)+'%';$('om').style.width=b.mp/b.maxMp*100+'%';$('myStatus').innerHTML=statusHTML(a.statuses);$('opStatus').innerHTML=statusHTML(b.statuses);$('myEquip').innerHTML=equipHTML(a);$('opEquip').innerHTML=equipHTML(b);$('myTraps').innerHTML=trapHTML(a,true);$('opTraps').innerHTML=trapHTML(b,false);$('cards').innerHTML=a.hand.map((c,i)=>`<button class="card ${esc(c.type)}" onclick="play(${i})"><b>${esc(c.name)}</b><span class="cost">MP ${c.cost}</span><div class="power">${c.power?c.power:'✨'}</div><small>${esc(c.desc||'')}</small></button>`).join('');$('log').innerHTML=(m.log||[]).map(x=>`・${esc(x)}`).join('<br>');$('msg').textContent=m.msg||''}
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}function play(i){if(turn===me)send({action:'play',type:'card',card:i})}function attack(){if(turn===me)send({action:'attack'})}function guard(){if(turn===me)send({action:'guard'})}function draw(){if(turn===me)send({action:'draw'})}
</script></html>
